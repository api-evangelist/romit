    get:
      operationId: getBankingAccount
      summary: Get a linked bank account
      tags: [Banking]
      responses:
        '200': { description: OK }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateBankingAccount
      summary: Update a linked bank account
      tags: [Banking]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        '200': { description: OK }
        default: { $ref: '#/components/responses/Error' }
  /banking/account/link:
    post:
