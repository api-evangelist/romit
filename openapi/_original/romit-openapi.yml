      tags: [Banking]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer: { type: string }
                selections: { type: array, items: { type: string } }
                code: { type: string }
                sendMethodMask: { type: string }
      responses:
        '200': { description: OK }
        default: { $ref: '#/components/responses/Error' }
  /banking/account/{id}/disable:
    parameters:
      - name: id
