        schema: { type: string }
    post:
      operationId: disableBankingCard
      summary: Disable a card
      tags: [Banking]
      responses:
        '200': { description: OK }
        default: { $ref: '#/components/responses/Error' }
  /banking/account/{id}:
    parameters:
      - name: id
